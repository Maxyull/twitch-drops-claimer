name: CodeQL

# GitHub's static security analysis (SAST), free on a public repository.
# Results land in Security > Code scanning.
#
# It earns its place here: this extension holds a Twitch session token and reads
# campaign names that Twitch controls. Both are exactly the shapes CodeQL is good
# at spotting, and a regression test only catches what someone thought to write.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 2" # weekly, picks up newly published CodeQL rules

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          languages: javascript-typescript
          # security-extended, not security-and-quality: the quality pack is
          # linting (unused variables, dead expressions) that buries the real
          # security alerts under noise nobody ever triages.
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          category: "/language:javascript-typescript"
