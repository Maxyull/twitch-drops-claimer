name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions pinned by commit SHA, not by tag. A tag is mutable: whoever controls
# the action repository can repoint `v4` at different code, which then runs with
# our token. The trailing comment keeps the human-readable version.
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Unit and regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build the package
        run: python scripts/build.py

      - name: Browser for the e2e tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Package as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: release/*.zip
          if-no-files-found: error
